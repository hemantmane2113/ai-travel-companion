{% extends "base.html" %}
{% block title %}Sign in · Travel Companion{% endblock %}
{% block body_class %}auth{% endblock %}
{% block body %}
<main class="auth-card">
  <h1>Travel Companion</h1>
  <p class="auth-sub">Sign in to plan your trip.</p>

  {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}

  <form method="post" action="/login">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" value="{{ email or '' }}" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Sign in</button>
  </form>

  <p class="auth-switch">New here? <a href="/register">Create an account</a></p>
</main>
{% endblock %}
