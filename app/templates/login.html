{% extends "auth_base.html" %}
{% block title %}Sign in · Travel Companion{% endblock %}
{% block auth_heading %}
<h1>Welcome back</h1>
<p class="auth-sub">Sign in to pick up your trips where you left them.</p>
{% endblock %}
{% block auth_form %}
<form method="post" action="/login" class="auth-form">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" value="{{ email or '' }}" required{% if not sign_in_buttons %} autofocus{% endif %}>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>

  <button type="submit" class="auth-submit">Sign in</button>
</form>
<p class="auth-switch">New here? <a href="/register">Create an account</a></p>
{% endblock %}
