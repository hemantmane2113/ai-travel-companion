<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0e6b62">
<title>{% block title %}Travel Companion{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230e6b62'/%3E%3Cpath d='M16 6l3.2 9.8L16 26l-3.2-10.2z' fill='%23fff'/%3E%3Cpath d='M16 6l3.2 9.8H12.8z' fill='%23f4a259'/%3E%3C/svg%3E">
<link rel="preload" href="{{ url_for('static', path='vendor/fonts/fraunces-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
<script>
  // Apply a chosen day/night theme before the page draws (theme.js handles the switch).
  try {
    var theme = localStorage.getItem("theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch (e) {}
</script>
<script src="{{ url_for('static', path='theme.js') }}" type="module"></script>
</head>
<body class="{% block body_class %}{% endblock %}"{% block body_data %}{% endblock %}>
{% block body %}{% endblock %}
</body>
</html>
