[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-travel-companion"
version = "0.1.0"
description = "LLM-powered travel companion: plan trips, learn about places, compare and book hotels."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "groq>=0.11",
    "openai>=1.50",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",  # timezone database; Windows has none built in
    "authlib>=1.3",  # sign-in with Google, GitHub
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
